name: Publish One Hub
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test simulation
        run: node --test website/destiny/world.test.js
      - name: Assemble static site
        run: |
          mkdir -p _site/destiny
          cp website/index.html website/home.css website/cover.js website/tasks.html website/tasks.css website/tasks.js website/styles.css _site/
          cp website/destiny/index.html website/destiny/game.css website/destiny/game.js website/destiny/world.js website/destiny/art.js _site/destiny/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
