    /* ---- The Flight — match the feather pattern ---- */
    {
      id: 'flight', name: 'The Flight', hint: 'Match the pattern: tap a feather, then its shaft slot.',
      init(s) { this.newPattern(s); s.batches = 0; s.sel = -1; s.errT = 0; },
      newPattern(s) {
        const cols = ['#c03030', '#e8e0d0', '#3b6ea8'];
        s.pattern = [0, 1, 2, Math.floor(Math.random() * 3)].map(i => cols[i % 3]);
        s.filled = [false, false, false, false];
        s.tray = s.pattern.slice();
        s.tray.push(cols[(Math.random() * 3) | 0]);
        s.tray.push(cols[(Math.random() * 3) | 0]);
        for (let i = s.tray.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [s.tray[i], s.tray[j]] = [s.tray[j], s.tray[i]]; }
        s.trayX = s.tray.map((_, i) => 9 + i * 12);
      },
      tick(s, dt) { s.errT = Math.max(0, s.errT - dt); if (s.batches >= 2) s.done = true; },
      down(s, x, y) {
        if (s.done) return;
        // tray pick
        if (y > 44) {
          for (let i = 0; i < s.tray.length; i++) {
            if (Math.abs(x - s.trayX[i]) < 4) { s.sel = i; return; }
          }
          s.sel = -1; return;
        }
        // slots
        if (y > 24 && y < 40) {
          const slot = Math.floor((x - 14) / 13);
          if (slot < 0 || slot > 3 || s.filled[slot]) return;
          if (s.sel < 0) return;
          if (s.tray[s.sel] === s.pattern[slot]) {
            s.filled[slot] = true; s.tray[s.sel] = null; s.sel = -1;
            if (s.filled.every(Boolean)) { s.batches++; this.newPattern(s); s.okT = 0.4; }
          } else { s.errT = 0.35; s.sel = -1; }
        }
      },
      draw(s, x, P, C2) {
        P(0, 0, 80, 60, '#6b5a3e');
        P(0, 0, 80, 4, '#5c4e34');
        for (let i = 0; i < 8; i++) P(i * 10, 8 + (i % 2) * 44, 1, 44, '#5c4e34');
        // pattern to match
        P(12, 4, 56, 1, '#241f30');
        s.pattern.forEach((c, i) => P(17 + i * 13, 6, 4, 4, c));
        // shafts
        for (let i = 0; i < 4; i++) {
          const sx = 14 + i * 13;
          P(sx, 26, 1.6, 16, '#c9b47a'); P(sx - 0.7, 42, 3, 2, '#b8b8c0');
          if (s.filled[i]) { P(sx - 1.7, 24, 4, 5, s.pattern[i]); P(sx - 1.7, 24, 4, 1, '#fff'); }
          else C2(sx + 0.8, 27, 2.6, 'rgba(255,233,160,.5)', 1);
        }
        // feather tray
        P(4, 44, 72, 1, '#241f30');
        s.tray.forEach((c, i) => {
          if (c == null) return;
          const fx = s.trayX[i], fy = 50 + (s.sel === i ? -2 : 0);
          P(fx - 1.5, fy - 3, 3, 6, c); P(fx, fy - 5, 1, 2, c); P(fx - 0.5, fy + 3, 1, 3, '#c9b47a');
        });
        if (s.errT > 0) P(24, 20, 32, 2, '#e05555');
        if (s.okT > 0) { s.okT -= 1 / 60; P(0, 0, 80, 60, `rgba(255,240,200,${s.okT})`); }
      },
      apply(s, site) {
        if (!s.batches) return null;
        let made = 0;
        for (let i = 0; i < s.batches; i++) {
          if (G.res.wood < 2 || G.res.arrows >= Buildings.capOf('arrows')) break;
          G.res.wood -= 2; made++;
        }
        if (!made) return null;
        Sim.gain('arrows', made * 14);
        Bench.payFx(site, `+${made * 14} arrows`, '#c9b47a');
        return `The Flight — ${made} matched batch${made > 1 ? 'es' : ''}: +${made * 14} arrows.`;
      },
    },

    /* ---- The Brew — tap the bubbles as they crest ---- */
    {
      id: 'brew', name: 'The Brew', hint: 'Tap each bubble the moment it crests the surface.',
      init(s) { s.bubbles = []; s.gauge = 0; s.spawn = 0; s.rip = []; },
      tick(s, dt) {
        s.spawn -= dt;
        if (s.spawn <= 0) { s.spawn = 0.45 + Math.random() * 0.45; s.bubbles.push({ x: 26 + Math.random() * 28, y: 42, v: 11 + Math.random() * 5 }); }
        for (const b of s.bubbles) b.y -= b.v * dt;
        s.bubbles = s.bubbles.filter(b => b.y > 12);
        for (const r of s.rip) r.t -= dt * 2;
        s.rip = s.rip.filter(r => r.t > 0);
        if (s.gauge >= 1) s.done = true;
      },
      down(s, x, y) {
        const crest = 18;
        for (let i = 0; i < s.bubbles.length; i++) {
          const b = s.bubbles[i];
          if (Math.hypot(x - b.x, y - b.y) < 4.5 && Math.abs(b.y - crest) < 4) {
            s.bubbles.splice(i, 1); s.gauge += 1 / 3; s.rip.push({ x: b.x, y: crest, t: 1 });
            return;
          }
        }
        s.gauge = Math.max(0, s.gauge - 0.04); // sloshed the vat for nothing
      },
      draw(s, x, P, C2) {
        P(0, 0, 80, 60, '#4a4038');
        P(0, 50, 80, 10, '#33291f');
        // kettle
        P(18, 10, 44, 4, '#5c5c66'); C2(40, 32, 22, '#2c2c34', 0); C2(40, 32, 20, '#71717d', 0);
        C2(40, 34, 17, '#181420', 0); C2(40, 35, 16, '#4a3018', 0);
        // wort surface + crest band
        P(24, 18, 32, 1, 'rgba(232,185,90,.7)');
        P(24, 16, 32, 4, 'rgba(255,217,119,.18)');
        for (const b of s.bubbles) { C2(b.x, b.y, 1.8, '#e8b95a', 0); C2(b.x - 0.4, b.y - 0.4, 0.8, '#f4d898', 0); }
        for (const r of s.rip) C2(r.x, r.y, 2 + (1 - r.t) * 3, `rgba(232,185,90,${r.t * 0.6})`, 1);
        // gauge: the brew darkening to bright ale
        P(64, 14, 6, 26, '#241f30');
        P(65, 15, 4, 24 * Math.min(1, s.gauge), '#d8b46a'); P(65, 15, 4, Math.min(4, 24 * Math.min(1, s.gauge)), '#f0e0b0');
      },
      apply(s, site) {
        if (s.gauge < 1) return null;
        if (G.res.food < 2 || G.res.herbs < 1) return null;
        G.res.food -= 2; G.res.herbs -= 1;
        Sim.gain('ale', 1);
        G.buffs.brightAle = true;
        Bench.payFx(site, 'bright ale', '#d8b46a');
        return 'The Brew — a watched brew pours bright: +15% work at tomorrow\u2019s pour.';
      },
    },

    /* ---- The Dip — wicks on the wave ---- */
    {
      id: 'dip', name: 'The Dip', hint: 'Tap on the wave\u2019s crest to dip each wick — three wicks, hand-dipped.',
      init(s) { s.waveT = 0; s.dips = 0; s.badT = 0; s.dropY = [0, 0, 0]; },
      tick(s, dt) {
        s.waveT += dt;
        s.badT = Math.max(0, s.badT - dt);
        for (let i = 0; i < 3; i++) s.dropY[i] = Math.max(0, s.dropY[i] - dt * 14);
        if (s.dips >= 3) s.done = true;
      },
      wave(s) { return Math.sin(s.waveT * 3.0); },
      down(s) {
        if (this.wave(s) > 0.82) {
          s.dips++; s.dropY[Math.min(2, s.dips - 1)] = 1; s.splash = 1;
        } else s.badT = 0.3;
      },
      draw(s, x, P, C2) {
        P(0, 0, 80, 60, '#4a4038');
        P(0, 46, 80, 14, '#5c4229'); P(0, 46, 80, 2, '#6e5136');
        // the dipping vat
        P(16, 20, 48, 26, '#6e4a28'); P(16, 20, 48, 2, '#8a5f37');
        const h = this.wave(s);
        const surf = 30 - h * 3;
        P(18, surf, 44, 44 - surf + 4, '#c9862e'); P(18, surf, 44, 2, '#e8c05a'); P(18, surf, 44, 1, '#f0dc9a');
        // crest highlight
        if (h > 0.82) { P(18, surf - 1, 44, 1, '#fff2b0'); }
        // wick rack + wicks
        P(10, 8, 60, 2, '#7a5a34');
        for (let i = 0; i < 3; i++) {
          const wx = 24 + i * 16;
          P(wx - 1, 10, 2, 6, '#e8e0d0');
          const dy = s.dropY[i] * 14;
          if (dy > 0) P(wx - 1, 16 + dy - 6, 2, 6, '#e8e0d0');
          P(wx - 1, 10, 2, 2, s.dips > i ? '#c9862e' : '#e8e0d0');
        }
        if (s.badT > 0) P(30, 4, 20, 2, '#e05555');
        // wave meter
        P(6, 52, 68, 3, '#241f30');
        P(6 + ((s.waveT * 10) % 68), 52, 3, 3, h > 0.82 ? '#ffe9a0' : '#6f6f7a');
      },
      apply(s, site) {
        if (s.dips < 3) return null;
        G.buffs.handDip = true;
        Bench.payFx(site, 'wicks dipped', '#e8c05a');
        return 'The Dip — hand-dipped wicks: the torches sip half oil tonight.';
      },
    },

    /* ---- The Suture — trace the wound, spare the red ---- */
    {
      id: 'suture', name: 'The Suture', hint: 'Trace the wound line end to end without crossing the raw red.',
      init(s) {
        s.pts = []; let px = 10, py = 30;
        for (let i = 0; i < 8; i++) { s.pts.push({ x: px, y: py }); px += 8 + Math.random() * 2; py += (Math.random() - 0.5) * 10; py = Math.max(16, Math.min(44, py)); }
        s.red = [s.pts[2], s.pts[5]].map(p => ({ x: p.x, y: p.y }));
        s.idx = 0; s.tracing = false; s.hearts = 2; s.bleedT = 0; s.doneT = 0;
      },
      tick(s, dt) { s.bleedT = Math.max(0, s.bleedT - dt); s.doneT = Math.max(0, s.doneT - dt); },
      down(s, x, y) {
        if (Math.hypot(x - s.pts[0].x, y - s.pts[0].y) < 5) { s.tracing = true; s.idx = 0; }
      },
      move(s, x, y) {
        if (!s.tracing || s.doneT > 0) return;
        for (const r of s.red) if (Math.hypot(x - r.x, y - r.y) < 4.2) {
          s.hearts--; s.tracing = false; s.idx = 0; s.bleedT = 0.5;
          if (s.hearts <= 0) s.done = true;
          return;
        }
        const n = s.pts[s.idx + 1];
        if (n && Math.hypot(x - n.x, y - n.y) < 4.5) {
          s.idx++;
          if (s.idx >= s.pts.length - 1) { s.doneT = 0.5; s.tracing = false; s.ok = true; s.done = true; }
          return;
        }
        const p = s.pts[s.idx];
        let near = 1e9;
        for (const q of [p, n]) if (q) near = Math.min(near, Math.hypot(x - q.x, y - q.y));
        if (near > 5.5) { s.tracing = false; s.idx = 0; }
      },
      up(s) { s.tracing = false; },
      draw(s, x, P, C2) {
        P(0, 0, 80, 60, '#d9a06c'); // skin
        for (let i = 0; i < 10; i++) P((i * 13) % 78, (i * 19) % 58, 2, 1, 'rgba(0,0,0,.05)');
        P(0, 0, 80, 8, '#f0c8a0'); P(0, 52, 80, 8, '#c9865a');
        // raw red danger zones
        for (const r of s.red) { C2(r.x, r.y, 4, 'rgba(180,30,30,.5)', 0); C2(r.x, r.y, 2.4, 'rgba(220,50,50,.75)', 0); }
        // the wound line: stitched where traced
        for (let i = 0; i < s.pts.length - 1; i++) {
          const a = s.pts[i], b = s.pts[i + 1];
          const steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y));
          for (let k = 0; k <= steps; k++) {
            const cx = a.x + (b.x - a.x) * k / steps, cy = a.y + (b.y - a.y) * k / steps;
            const stitched = i < s.idx;
            P(cx - 0.5, cy - 0.5, 1.4, 1.4, stitched ? '#8a1c1c' : '#5a1010');
            if (stitched && k % 4 === 0) P(cx - 0.5, cy - 1.5, 1, 3, '#e8e0d0'); // little stitches
          }
        }
        C2(s.pts[0].x, s.pts[0].y, 2.2 + (s.tracing ? Math.sin(s.t * 8) * 0.5 : 0), 'rgba(255,233,160,.9)', 1);
        for (let h = 0; h < s.hearts; h++) P(70 + h * 4, 3, 2, 2, '#e05555');
        if (s.bleedT > 0) P(0, 0, 80, 60, `rgba(160,20,20,${s.bleedT * 0.45})`);
        if (s.doneT > 0) P(0, 0, 80, 60, `rgba(255,240,200,${s.doneT})`);
      },
      apply(s, site) {
        if (!s.ok) return null;
        G.buffs.suture = true;
        Bench.payFx(site, 'steady hands', '#3f9d84');
        return 'The Suture — the medic\u2019s next mends restore +15 hp per herb today.';
      },
    },

    /* ---- The Spark — strike sparks until the brazier catches ---- */
    {
      id: 'spark', name: 'The Spark', hint: 'Strike fast — fill the striker\u2019s heat before it drains. Catch it early for a strong kindle.',
      init(s) { s.heat = 0; s.sparks = []; s.strong = false; },
      tick(s, dt) {
        s.heat = Math.max(0, s.heat - dt * 0.30);
        for (const sp of s.sparks) { sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.t -= dt; }
        s.sparks = s.sparks.filter(p => p.t > 0);
        if (s.heat >= 1) {
          s.strong = s.t < CONFIG.BENCH.sessionT * 0.6;
          s.done = true;
        }
      },
      down(s) {
        s.heat = Math.min(1.001, s.heat + 0.085);
        for (let i = 0; i < 3; i++) s.sparks.push({ x: 40, y: 30, vx: (Math.random() - .5) * 40, vy: -20 - Math.random() * 25, t: 0.4 + Math.random() * 0.3 });
      },
      draw(s, x, P, C2) {
        P(0, 0, 80, 60, '#241f30');
        for (let i = 0; i < 16; i++) P((i * 7) % 78, (i * 13) % 58, 1, 1, 'rgba(200,180,255,.12)');
        P(0, 48, 80, 12, '#33291f');
        // the brazier
        P(32, 40, 16, 6, '#6e6e78'); P(32, 40, 16, 1, '#8d8d95');
        P(34, 46, 3, 6, '#55555f'); P(43, 46, 3, 6, '#55555f');
        P(34, 38, 12, 3, s.heat > 0.5 ? '#6e3418' : '#3a3a44');
        if (s.heat > 0.6) { P(36, 34, 8, 4, '#ff7a2e'); P(38, 31, 4, 4, '#ffce56'); }
        // the striker cap
        C2(40, 22, 6, '#3a3a44', 0); C2(40, 22, 5, '#55555f', 0); P(38, 18, 4, 2, '#71717d');
        // sparks
        for (const sp of s.sparks) P(sp.x, sp.y, 1, 1, sp.t % 0.2 > 0.1 ? '#fff2b0' : '#ffd977');
        // heat gauge
        P(66, 10, 7, 34, '#181420');
        P(67, 11 + 32 * (1 - s.heat), 5, 32 * s.heat, s.heat > 0.75 ? '#ffd977' : '#e86a1e');
        P(66, 9, 7, 1, s.heat > 0.75 ? '#ffe9a0' : '#3a3a44');
      },
      apply(s, site) {
        if (s.heat < 1) return null;
        const b = site && site.b;
        if (!b || !Sim.kindle(b, s.strong)) return null;
        Bench.payFx(site, s.strong ? 'STRONG kindle!' : 'kindled', '#ffb057');
        return s.strong
          ? 'The Spark — a STRONG kindle: the brazier burns a night and a half.'
          : 'The Spark — the brazier catches and will burn till dawn.';
      },
    },

    /* ---- The Effigy — tap the shape the straw shade raises ---- */
    {
      id: 'effigy', name: 'The Effigy', hint: 'Tap the drill-shape the straw shade raises — four true calls and the drill lands now.',
      init(s) { s.shape = -1; s.showT = 0.6; s.gapT = 0; s.hits = 0; s.flash = 0; s.errT = 0; },
      SHAPES: ['shield', 'pike', 'claw'],
      tick(s, dt) {
        s.flash = Math.max(0, s.flash - dt); s.errT = Math.max(0, s.errT - dt);
        if (s.shape < 0) {
          s.gapT -= dt;
          if (s.gapT <= 0) { s.shape = (Math.random() * 3) | 0; s.showT = 0.95; }
        } else {
          s.showT -= dt;
          if (s.showT <= 0) { s.shape = -1; s.gapT = 0.45; s.late = 0.5; }
        }
        if (s.late > 0) s.late -= dt;
        if (s.hits >= 4) s.done = true;
      },
      down(s, x, y) {
        if (y < 42 || s.done) return;
        const hit = x < 27 ? 0 : x < 53 ? 1 : 2;
        if (s.shape >= 0 && hit === s.shape) { s.hits++; s.flash = 0.3; }
        else if (s.late > 0 && hit === s.lastShape) { s.hits++; s.flash = 0.3; } // called just after the hide
        else { s.errT = 0.4; }
        s.shape = -1; s.gapT = 0.4 + Math.random() * 0.3; s.lastShape = hit;
      },
      draw(s, x, P, C2) {
        P(0, 0, 80, 60, '#5a8a4a');
        P(0, 40, 80, 20, '#7c5f42'); P(0, 40, 80, 2, '#8a6d4e');
        for (let i = 0; i < 8; i++) P(4 + i * 10, 44 + (i % 3) * 4, 2, 1, '#6e5136');
        // the straw-shade effigy
        P(34, 30, 12, 12, '#c9a94b'); P(33, 32, 14, 8, '#c9a94b'); P(34, 30, 12, 1, '#e0c46a');
        P(36, 33, 2, 2, '#7a4ec0'); P(42, 33, 2, 2, '#7a4ec0');
        P(38, 37, 4, 1, '#8a6a1e');
        P(31, 34, 3, 5, '#b8942e'); P(46, 32, 3, 6, '#b8942e');
        P(30, 44, 3, 8, '#6b4a2b'); P(47, 44, 3, 8, '#6b4a2b');
        // the raised shape
        if (s.shape >= 0) {
          const bob = Math.sin(s.t * 9) * 1.2;
          const sy = 12 + bob;
          if (s.shape === 0) { C2(40, sy + 3, 5, 'rgba(255,233,160,.9)', 1); P(38, sy, 5, 3, '#e8e0d0'); P(39, sy + 3, 3, 2, '#c9ced9'); }
          else if (s.shape === 1) { P(39, sy, 2.4, 12, '#c9b47a'); P(39, sy - 2, 2.4, 3, '#cfd8e0'); }
          else { P(35, sy, 3, 2, '#e8e0d0'); P(38, sy + 2, 3, 2, '#e8e0d0'); P(42, sy + 1, 3, 2, '#e8e0d0'); P(36, sy + 4, 2, 2, '#cfd8e0'); P(41, sy + 5, 2, 2, '#cfd8e0'); }
        }
        // the three drill buttons
        const labels = [['shield', 4], ['pike', 30], ['claw', 56]];
        for (const [nm, bx] of labels) {
          P(bx, 44, 20, 14, '#241f30');
          P(bx + 1, 45, 18, 12, s.flash > 0 && nm === 'x' ? '#33301f' : '#2c2c34');
          if (nm === 'shield') { P(bx + 8, 47, 4, 5, '#e8e0d0'); P(bx + 9, 52, 2, 2, '#c9ced9'); }
          else if (nm === 'pike') { P(bx + 9, 46, 2, 8, '#c9b47a'); P(bx + 9, 45, 2, 2, '#cfd8e0'); }
          else { P(bx + 6, 47, 3, 2, '#e8e0d0'); P(bx + 9, 49, 3, 2, '#e8e0d0'); P(bx + 12, 48, 3, 2, '#e8e0d0'); }
        }
        for (let i = 0; i < s.hits; i++) P(4 + i * 4, 3, 2, 2, '#ffe9a0');
        if (s.errT > 0) P(30, 24, 20, 2, '#e05555');
      },
      apply(s, site) {
        const b = site && site.b;
        if (!b || !b.drillType || s.hits < 4) return null;
        const cur = G.drill[b.drillType] || 0;
        if (cur >= CONFIG.MUSTER.bonusCap) return null;
        G.drill[b.drillType] = Math.min(CONFIG.MUSTER.bonusCap, cur + CONFIG.MUSTER.bonus);
        b.drillT = 0;
        const nm = { runner: 'shields', brute: 'pikes', stalker: 'scatter' }[b.drillType];
        Bench.payFx(site, 'drill lands!', '#e8a94b');
        return `The Effigy — the drill played true: +10% vs ${CONFIG.MONS[b.drillType].name}s, landed today.`;
      },
    },
  ],
};

/* ============================================================
   THE DEEP SEAM — push-your-luck mining below a Mine Shaft.
   Each level the seam gets richer, and the spinning wheel
   decides: okay, injured, dead. An injured or dead miner gets
   one chance at the rescue — win, and injured becomes okay,
   dead becomes injured. ============================================================ */
const Seam = {
  /* -------- entry checks (used by the Mine Shaft card) -------- */
  canDig(b) {
    if (!b || !b.built || b.key !== 'mine') return { ok: false, why: 'The shaft is not built.' };
    if (b.seamDay === G.day) return { ok: false, why: 'The seam is dug out for today — try again at dawn.' };
    if (!isDayLike()) return { ok: false, why: 'Nobody descends after dark.' };
    if (!G.villagers.some(v => v.job === 'miner' && !v.below && v.hp > 0)) return { ok: false, why: 'No miner is free to descend.' };
    return { ok: true };
  },

  start(b) {
    const chk = this.canDig(b);
    if (!chk.ok) { UI.toast(chk.why, ''); return false; }
    // the nearest free miner takes the descent
    let who = null, bd = 1e9;
    for (const v of G.villagers) {
      if (v.job !== 'miner' || v.below || v.hp <= 0) continue;
      const d = U.dst2(v.x, v.y, b.x, b.y);
      if (d < bd) { bd = d; who = v; }
    }
    b.seamDay = G.day;
    who.below = true;
    UI.selHide();
    Bench.seam = {
      b, v: who,
      depth: b.seamDepth || 0,
      haul: 0, haulEss: 0, flint: false,
      phase: 'idle',            // idle | spin | result | rescue | over
      t: 0,
      wheelA: -Math.PI / 2, spinT: 0, spinDur: 1.7, spinFrom: 0, spinTo: 0, result: null,
      rescue: null,
      shakeT: 0,
    };
    Bench.show('The Deep Seam', `${who.name} the Miner descends. The seam is richest far below — if it lets them come back up.`);
    this.syncBtns();
    return true;
  },

  close() {
    const s = Bench.seam;
    if (!s) return;
    if (s.phase === 'result' && s.result === 'dead') return; // must choose: rescue or leave him
    if (s.phase === 'spin') return; // let the wheel land
    this.finishSession();
  },

  finishSession() {
    const s = Bench.seam;
    if (!s) return;
    const b = s.b, v = s.v;
    Bench.seam = null;
    if (v && G.villagers.includes(v)) {
      v.below = false;
      v.state = 'idle'; v.path = null;
    }
    Bench.hideOverlay();
    UI.updateHUD();
  },

  syncBtns() {
    const s = Bench.seam;
    if (!s) return;
    if (s.phase === 'idle') {
      const next = seamOdds(s.depth);
      Bench.setBtns([
        { label: `\u2b07 Go deeper (${s.depth + 1})`, fn: () => Seam.go() },
        { label: '\u2b06 Climb out', fn: () => Seam.finishSession() },
      ]);
      Bench.setHint(`Depth ${s.depth} \u00b7 haul: ${s.haul} stone${s.haulEss ? `, ${s.haulEss} essence` : ''}${s.flint ? ', flint' : ''}. Next level — OK ${Math.round(next.ok * 100)}% \u00b7 hurt ${Math.round(next.inj * 100)}% \u00b7 lost ${Math.round(next.dead * 100)}%.`);
    } else if (s.phase === 'result') {
      if (s.result === 'ok') Bench.setBtns([
        { label: '\u2b07 Go deeper', fn: () => Seam.go() },
        { label: '\u2b06 Climb out with the haul', fn: () => Seam.finishSession() },
      ]);
      else if (s.result === 'inj') Bench.setBtns([
        { label: '\u2695 Rescue him!', fn: () => Seam.tryRescue() },
        { label: 'Leave him to crawl home', warn: true, fn: () => { Seam.applyInjury(); Seam.finishSession(); } },
      ]);
      else Bench.setBtns([
        { label: '\u2695 Dig him out!', fn: () => Seam.tryRescue() },
        { label: 'It is too late', warn: true, fn: () => { Seam.applyDeath(); Seam.finishSession(); } },
      ]);
    } else if (s.phase === 'rescue') {
      Bench.setBtns([]);
    } else Bench.setBtns([]);
  },

  /* -------- the spin -------- */
  go() {
    const s = Bench.seam;
    if (!s || s.phase === 'spin') return;
    const d = s.depth; // attempting depth d+1
    const odds = seamOdds(d);
    const r = Math.random();
    s.result = r < odds.ok ? 'ok' : r < odds.ok + odds.inj ? 'inj' : 'dead';
    // aim the wheel so the needle (fixed at angle 0, east) lands inside the
    // chosen sector: sector i is under the needle iff (-wheelA) mod 2π sits
    // in [i·seg, (i+1)·seg) — so we steer spinTo ≡ -target (mod 2π)
    const sector = s.result === 'ok' ? 0 : s.result === 'inj' ? 1 : 2;
    const seg = (Math.PI * 2) / 3;
    const target = sector * seg + seg / 2 + (Math.random() - 0.5) * seg * 0.7;
    const laps = Math.PI * 2 * (2.5 + Math.random() * 1.5);
    const delta = (((-target) - s.spinFrom) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    s.spinFrom = s.wheelA;
    s.spinTo = s.wheelA + laps + delta;
    s.spinT = 0;
    s.phase = 'spin';
    this.syncBtns();
  },

  resolveSpin() {
    const s = Bench.seam;
    s.phase = 'result';
    if (s.result === 'ok') {
      s.depth++;
      s.b.seamDepth = s.depth;
      const pay = seamPay(s.depth);
      Sim.gain('stone', pay.stone);
      s.haul += pay.stone;
      if (pay.ess) {
        G.res.essence = Math.min(CONFIG.ESSENCE.max, G.res.essence + pay.ess);
        s.haulEss += pay.ess;
      }
      if (pay.flint) { G.buffs.flintDays = CONFIG.SEAM.flintDays; s.flint = true; }
      Sim.float(s.b.x + .5, s.b.y - .3, `+${pay.stone} stone${pay.ess ? ' +' + pay.ess + ' essence' : ''}`, '#a5a5ae');
      Bench.payFx({ b: s.b }, `depth ${s.depth}`, '#ffe9a0');
      Sim.log(`${s.v.name} struck a rich seam at depth ${s.depth} (+${pay.stone} stone${pay.ess ? ', +' + pay.ess + ' essence' : ''}${pay.flint ? ', flint' : ''}).`, '');
      UI.updateHUD();
    } else {
      s.shakeT = 0.8;
      // the tunnel seals — everything about this level is lost, the depth collapses
      s.b.seamDepth = 0;
      s.depth = 0;
    }
    this.syncBtns();
  },

  applyInjury() {
    const s = Bench.seam;
    if (!s) return;
    const v = s.v;
    v.hp = Math.max(1, Math.round(v.maxHp * CONFIG.SEAM.hurtHp));
    Sim.log(`${v.name} crawled out of the Deep Seam hurt.`, 'bad');
  },

  applyDeath() {
    const s = Bench.seam;
    if (!s) return;
    const v = s.v;
    if (G.villagers.includes(v)) Sim.villagerDeath(v, 'a tunnel collapse');
    s.v = null;
  },

  /* -------- the rescue skill game: dodge the falling rock -------- */
  tryRescue() {
    const s = Bench.seam;
    if (!s || (s.phase !== 'result')) return;
    const dead = s.result === 'dead';
    s.phase = 'rescue';
    s.rescue = {
      mx: 40, tx: 40, rocks: [], spawn: 0.4, t: 0,
      hits: 0, win: null, dead,
      // the dead must be dug out of deeper rubble: less time, more rock
      dur: dead ? CONFIG.SEAM.rescueT + 2 : CONFIG.SEAM.rescueT,
    };
    Bench.setHint(dead
      ? 'RESCUE — steer the ropeline through the falling rock. Two hits and he is lost. Survive, and he comes up hurt but alive.'
      : 'RESCUE — steer the ropeline through the falling rock. Two hits and the injury stands. Survive, and he walks away clean.');
    this.syncBtns();
  },

  tickRescue(dt) {
    const s = Bench.seam, r = s.rescue;
    r.t += dt;
    r.mx = U.lerp(r.mx, r.tx, Math.min(1, dt * 12));
    r.spawn -= dt;
    const rate = 0.75 - Math.min(0.45, r.t * 0.07);
    if (r.spawn <= 0) {
      r.spawn = rate * (0.6 + Math.random() * 0.7);
      r.rocks.push({ x: 8 + Math.random() * 64, y: -3, v: 16 + Math.random() * 12, sz: 1.6 + Math.random() * 1.6 });
    }
    for (const k of r.rocks) {
      k.y += k.v * dt;
      if (k.hitT > 0) k.hitT -= dt;
      else if (!k.done && k.y > 44 && k.y < 50 && Math.abs(k.x - r.mx) < 2.6 + k.sz * 0.5) {
        k.done = true; r.hits++; s.shakeT = 0.4;
      }
    }
    r.rocks = r.rocks.filter(k => k.y < 64);
    if (r.hits >= CONFIG.SEAM.rescueHits) r.win = false;
    else if (r.t >= r.dur) r.win = true;
    if (r.win != null) this.resolveRescue();
  },

  resolveRescue() {
    const s = Bench.seam, r = s.rescue;
    const v = s.v;
    s.phase = 'over';
    if (r.win) {
      if (r.dead) {
        // dead becomes injured — pulled from the rubble alive
        v.below = false; v.state = 'idle'; v.path = null;
        v.hp = Math.max(1, Math.round(v.maxHp * CONFIG.SEAM.hurtHp));
        UI.toast(`${v.name} is pulled from the rubble — hurt, but ALIVE.`, 'good');
        Sim.log(`${v.name} was dug out of a seam collapse — bruised, breathing, alive.`, 'good');
      } else {
        // injured becomes okay — walks out of the shaft there and then
        v.below = false; v.state = 'idle'; v.path = null;
        v.hp = v.maxHp;
        UI.toast(`${v.name} is pulled clear — not a scratch.`, 'good');
        Sim.log(`${v.name} was rescued from a seam collapse without a scratch.`, 'good');
      }
    } else {
      if (r.dead) {
        this.applyDeath();
      } else {
        this.applyInjury();
        UI.toast(`${v.name} crawls out of the Deep Seam hurt.`, 'bad');
      }
    }
    Bench.setHint(r.win ? 'RESCUED.' : (r.dead ? 'The rubble settles...' : 'He limps home.'));
    Bench.setBtns([{ label: 'Leave the shaft', fn: () => Seam.finishSession() }]);
  },

  /* -------- pointer -------- */
  pointer(type, x, y) {
    const s = Bench.seam;
    if (!s) return;
    if (s.phase === 'rescue' && s.rescue && !s.rescue.win) {
      if (type === 'down' || type === 'move') s.rescue.tx = U.clamp(x, 6, 74);
    }
  },

  /* -------- frame tick -------- */
  tick(dt) {
    const s = Bench.seam;
    if (!s) return;
    s.t += dt;
    s.shakeT = Math.max(0, s.shakeT - dt);
    if (s.phase === 'spin') {
      s.spinT += dt;
      const p = Math.min(1, s.spinT / s.spinDur);
      const e = 1 - Math.pow(1 - p, 3);
      s.wheelA = U.lerp(s.spinFrom, s.spinTo, e);
      if (p >= 1) { s.wheelA = s.spinTo; this.resolveSpin(); }
    } else if (s.phase === 'rescue' && s.rescue && s.rescue.win == null) {
      this.tickRescue(dt);
    }
  },

  /* -------- drawing -------- */
  draw(x) {
    const s = Bench.seam;
    if (!s) return;
    const P = (px, py, w, h, col) => { x.fillStyle = col; x.fillRect(px * 4 | 0, py * 4 | 0, Math.max(1, w * 4 | 0), Math.max(1, h * 4 | 0)); };
    const C2 = (cx, cy, r, col, lw) => {
      x.beginPath();
      x.arc(cx * 4, cy * 4, Math.max(0.5, r * 4), 0, Math.PI * 2);
      if (lw) { x.strokeStyle = col; x.lineWidth = lw; x.stroke(); }
      else { x.fillStyle = col; x.fill(); }
    };
    const sh = s.shakeT > 0 ? (Math.random() - .5) * 3 : 0;
    x.save();
    x.translate(sh, sh);

    // —— the shaft cutaway ——
    P(0, 0, 80, 60, '#241f30');
    for (let i = 0; i < 20; i++) P((i * 13) % 78, (i * 29) % 58, 2, 1, 'rgba(120,100,160,.08)');
    P(0, 8, 80, 3, '#4e7a40');                    // grass line
    P(0, 11, 80, 2, '#6e5136');                   // soil
    P(8, 4, 12, 8, '#3a3026');                    // mine hut
    P(10, 6, 8, 6, '#181420');                    // entrance
    P(9, 3, 10, 1, '#6b4a2b'); P(9, 3, 1, 5, '#6b4a2b'); P(18, 3, 1, 5, '#6b4a2b');
    // the shaft, level bands
    for (let lv = 0; lv < 8; lv++) {
      const ly = 16 + lv * 5.4;
      P(24, ly, 32, 4.4, lv % 2 ? '#33291f' : '#3a3026');
      P(24, ly, 32, 0.6, '#181420');
      // level marker + pay hint
      const pay = seamPay(lv + 1);
      P(58, ly + 1.4, 2, 1.6, pay.ess ? '#b48ae0' : pay.flint ? '#8fc9e8' : '#8d8d95');
    }
    // dug depth glow
    for (let lv = 0; lv < s.depth; lv++) P(25, 17 + lv * 5.4, 30, 3.4, 'rgba(255,217,119,.06)');
    // the miner (or the ropeline during rescue)
    const my = 18 + Math.min(7, s.depth) * 5.4 - 4;
    if (s.phase !== 'rescue') {
      P(38, my, 3, 5, '#7d7d85'); P(38.4, my - 2.6, 2.2, 2.6, '#f0c8a0'); P(38.4, my - 3.4, 2.2, 1, '#3a2a1a');
      P(41, my + 1, 2, 1, '#b8bcc8'); // pick
    }
    // —— the wheel ——
    if (s.phase === 'spin' || s.phase === 'result') {
      const cx = 40, cy = 30, r = 11;
      const seg = (Math.PI * 2) / 3;
      const cols = ['#2e6230', '#a3762a', '#7c2430'];
      const labels = ['OK', 'HURT', 'LOST'];
      for (let i = 0; i < 3; i++) {
        x.beginPath();
        x.moveTo(cx * 4, cy * 4);
        x.arc(cx * 4, cy * 4, r * 4, s.wheelA + i * seg, s.wheelA + (i + 1) * seg);
        x.closePath();
        x.fillStyle = cols[i]; x.fill();
        x.strokeStyle = '#181420'; x.lineWidth = 1.5; x.stroke();
        const mid = s.wheelA + (i + 0.5) * seg;
        x.fillStyle = 'rgba(255,255,255,.85)';
        x.font = 'bold 8px monospace'; x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillText(labels[i], cx * 4 + Math.cos(mid) * r * 2.4, cy * 4 + Math.sin(mid) * r * 2.4);
      }
      C2(cx, cy, 2, '#181420', 0); C2(cx, cy, 1.2, '#e8e4d8', 0);
      // needle at east
      P(cx + r + 0.5, cy - 0.6, 3, 1.2, '#ffe9a0'); P(cx + r + 2.5, cy - 1.4, 1.4, 2.8, '#ffe9a0');
      if (s.phase === 'result' && s.result !== 'ok') {
        x.fillStyle = s.result === 'dead' ? '#ff6a6a' : '#ffc46b';
        x.font = 'bold 11px monospace'; x.textAlign = 'center';
        x.fillText(s.result === 'dead' ? 'COLLAPSE!' : 'THE TUNNEL SHIFTS!', 160, 60);
      } else if (s.phase === 'result') {
        x.fillStyle = '#9fe08a'; x.font = 'bold 11px monospace'; x.textAlign = 'center';
        x.fillText('A RICH POCKET!', 160, 60);
      }
    }
    // —— the rescue game ——
    if (s.phase === 'rescue' && s.rescue) {
      const r = s.rescue;
      // pit scene
      for (let lv = 0; lv < 8; lv++) P(24, 16 + lv * 5.4, 32, 4.4, lv % 2 ? '#33291f' : '#3a3026');
      P(24, 12, 32, 44, '#181420');
      for (const k of r.rocks) { C2(k.x, k.y, k.sz, '#6e6e78', 0); C2(k.x - k.sz * 0.3, k.y - k.sz * 0.3, k.sz * 0.4, '#8d8d95', 0); }
      // the ropeline + miner
      P(r.mx - 0.4, 12, 0.8, 32, 'rgba(232,228,216,.5)');
      const bobY = 44 + Math.sin(r.t * 8) * 0.6;
      P(r.mx - 1.5, bobY, 3, 5, '#7d7d85'); P(r.mx - 1.2, bobY - 2.6, 2.4, 2.6, '#f0c8a0');
      if (r.hits > 0) P(r.mx - 2, bobY - 1, 4, 1, '#e05555');
      // hearts + timer
      for (let i = 0; i < CONFIG.SEAM.rescueHits; i++) P(64 + i * 4, 4, 2, 2, i < CONFIG.SEAM.rescueHits - r.hits ? '#e05555' : '#3a3a44');
      P(8, 4, 64, 2, '#33291f');
      P(8, 4, 64 * (1 - r.t / r.dur), 2, '#ffe9a0');
      if (r.win === true) { x.fillStyle = '#9fe08a'; x.font = 'bold 12px monospace'; x.textAlign = 'center'; x.fillText('PULLED CLEAR!', 160, 100); }
      if (r.win === false) { x.fillStyle = '#ff6a6a'; x.font = 'bold 12px monospace'; x.textAlign = 'center'; x.fillText('THE ROCK WINS', 160, 100); }
    }
    // —— idle: depth & haul readout ——
    if (s.phase === 'idle') {
      x.fillStyle = '#e8e4d8'; x.font = 'bold 9px monospace'; x.textAlign = 'left';
      x.fillText(`DEPTH ${s.depth}`, 8, 18);
      x.fillStyle = '#9aa3b5'; x.font = '8px monospace';
      x.fillText(`haul ${s.haul} stone${s.haulEss ? ' + ' + s.haulEss + ' ess' : ''}`, 8, 26);
      if (s.flint) { x.fillStyle = '#8fc9e8'; x.fillText('flint!', 8, 33); }
    }
    x.restore();
  },
};
</script>

<script>
'use strict';
/* ============================================================
   Dawnhold — save.js
   localStorage saves: 1 autosave + 3 manual slots.
   World arrays are serialized verbatim (roads & depletion must
   persist); villagers keep their identity (names, traits, looks).
   ============================================================ */

const SaveSys = {
  KEY: 'dawnhold_save_',
  ver: CONFIG.SAVE_V,

  serialize() {
    return {
      v: this.ver,
      seed: G.seed, day: G.day, time: G.time, phase: G.phase,
      diff: G.diff, res: { ...G.res },
      jobs: { ...G.jobs },
      unlocks: { ...G.unlocks },
      stats: { ...G.stats },
      chronicle: G.chronicle.slice(-60),
      tut: G.tut, tutOn: G.tutOn,
      settings: { ...G.settings },
      finalNight: G.finalNight, beaconLit: G.beaconLit, finalNightDay: G.finalNightDay || 0,
      handsUsed: G.handsUsed || 0,
      buffs: { ...G.buffs },
      drill: { ...(G.drill || {}) },
      endless: !!G.endless,
      // wildcraft (v1.6): villagers are saved by array position, so partner /
      // banns / hunt-driver links ride as indexes and are re-linked on load
      tend: Array.from(G.tend.entries()),
      cuttings: G.cuttings || 0,
      sigils: (G.sigils || []).map(s => ({ kind: s.kind, tiles: s.tiles, day: s.day, bloomed: !!s.bloomed })),
      digs: (G.digJobs || []).map(t => [t.x, t.y]),
      dug: G.dug || 0,
      fellCount: G.fellCount || 0,
      feastPending: !!G.feastPending,
      banns: (G.banns || []).map(r => [G.villagers.indexOf(Wilds.villById(r.a)), G.villagers.indexOf(Wilds.villById(r.b))]).filter(r => r[0] >= 0 && r[1] >= 0),
      herd: G.herd ? {
        day: G.herd.day, hunt: !!G.herd.hunt, caught: G.herd.caught || 0,
        spawn: { ...G.herd.spawn },
        drivers: (G.herd.drivers || []).map(id => G.villagers.findIndex(v => v.id === id)).filter(ix => ix >= 0),
        deer: G.herd.deer.map(d => ({ x: d.x, y: d.y, anim: d.anim, dang: d.dang })),
      } : null,
      wave: G.wave ? { left: G.wave.left, comps: G.wave.comps, t: G.wave.t, window: G.wave.window } : null,
      cam: { x: G.cam.x, y: G.cam.y, z: G.cam.z },
      nextId: _id,
      world: {
        t: Array.from(World.t), obj: Array.from(World.obj), amt: Array.from(World.amt),
        regrow: Array.from(G.regrow.entries()),
      },
      buildings: G.buildings.map(b => ({
        key: b.key, x: b.x, y: b.y, hp: b.hp, built: b.built, progress: b.progress,
        growth: b.growth, lit: b.lit,
        fuel: b.fuel || 0, drillType: b.drillType || null, drillT: b.drillT || 0,
        seamDepth: b.seamDepth || 0, seamDay: b.seamDay || 0,
        sap: b.sap || 0, phase: b.phase || null, decT: b.decT || 0,
        demo: !!b.demo,
        clear: (b.clearTiles || []).map(t => [t.x, t.y]),
      })),
      clears: (G.clearJobs || []).map(t => t.water ? [t.x, t.y, 1] : [t.x, t.y]),
      villagers: G.villagers.map(v => ({
        name: v.name, trait: v.trait ? v.trait.key : null, look: { ...v.look },
        job: v.job, x: v.x, y: v.y, hp: v.hp, maxHp: v.maxHp, hunger: v.hunger,
        thirst: v.thirst == null ? 30 : v.thirst, schooled: !!v.schooled,
        state: v.state === 'arrive' ? 'arrive' : 'idle',
        carry: { type: v.carry.type, amt: v.carry.amt },
        toolCond: v.toolCond == null ? CONFIG.TOOL.cond : v.toolCond, buzzed: !!v.buzzed,
        partnerIx: v.partner != null ? G.villagers.findIndex(o => o.id === v.partner) : -1,
      })),
      monsters: G.monsters.map(m => ({
        type: m.type, x: m.x, y: m.y, hp: m.hp, burning: m.burning > 0,
      })),
    };
  },

  save(slot) {
    try {
      const data = this.serialize();
      data.when = Date.now();
      localStorage.setItem(this.KEY + slot, JSON.stringify(data));
      if (slot !== 'auto') UI.toast('Game saved.', 'good');
      return true;
    } catch (e) {
      UI.toast('Save failed (storage full?)', 'bad');
      return false;
    }
  },

  autosave() { this.save('auto'); },

  readMeta(slot) {
    try {
      const raw = localStorage.getItem(this.KEY + slot);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return { day: d.day, diff: d.diff, pop: (d.villagers || []).length, when: d.when || 0, v: d.v };
    } catch (e) { return null; }
  },

  has(slot) { return !!localStorage.getItem(this.KEY + slot); },

  del(slot) { localStorage.removeItem(this.KEY + slot); },

  load(slot) {
    let d;
    try { d = JSON.parse(localStorage.getItem(this.KEY + slot)); } catch (e) { return false; }
    if (!d || d.v !== this.ver) { UI.toast('Save is incompatible.', 'bad'); return false; }

    G.state = 'playing';
    G.seed = d.seed; G.day = d.day; G.time = d.time; G.phase = d.phase;
    G.diff = d.diff in CONFIG.DIFF ? d.diff : 'normal';
    G.diffM = CONFIG.DIFF[G.diff];
    G.res = { wood: d.res.wood || 0, stone: d.res.stone || 0, food: d.res.food || 0, essence: d.res.essence || 0, herbs: d.res.herbs || 0, arrows: d.res.arrows || 0, tools: d.res.tools || 0, meals: d.res.meals || 0, ale: d.res.ale || 0,
              water: d.res.water || 0, oil: d.res.oil || 0, bottles: d.res.bottles || 0, charcoal: d.res.charcoal || 0, flour: d.res.flour || 0, bread: d.res.bread || 0 };
    G.jobs = { idle: 0, forager: 0, lumber: 0, miner: 0, farmer: 0, fisher: 0, medic: 0, builder: 0, guard: 0, fletcher: 0, smith: 0, cook: 0, brewer: 0, bottler: 0, baker: 0, scribe: 0 };
    for (const k of JOBS) if (k !== 'idle') G.jobs[k] = d.jobs[k] || 0;
    if (d.jobs.herbalist) G.jobs.medic = (G.jobs.medic || 0) + d.jobs.herbalist; // v1.1: herbalist → medic
    G.unlocks = d.unlocks || {};
    G.stats = { ...d.stats };
    G.chronicle = d.chronicle || [];
    G.tut = d.tut || 0; G.tutOn = !!d.tutOn;
    G.settings = Object.assign({ fx: true, autosave: true }, d.settings);
    G.finalNight = !!d.finalNight; G.beaconLit = !!d.beaconLit; G.finalNightDay = d.finalNightDay || 0;
    G.handsUsed = d.handsUsed || 0;
    G.buffs = d.buffs || {};
    G.drill = Object.assign({ runner: 0, brute: 0, stalker: 0 }, d.drill || {});
    G.endless = !!d.endless;
    // wildcraft (v1.6): tend stages, cuttings, sigils, digs, the herd, the banns
    G.tend = new Map(d.tend || []);
    G.cuttings = d.cuttings || 0;
    G.sigils = (d.sigils || []).map(s => ({ kind: s.kind, tiles: s.tiles, day: s.day || 1, bloomed: !!s.bloomed }));
    G.sigilDraft = null;
    G.digJobs = (d.digs || []).map(([x, y]) => ({ x, y }));
    G.dug = d.dug || 0;
    G.fellCount = d.fellCount || 0;
    G.feastPending = !!d.feastPending;
    G.herd = null;
    G.banns = [];
    G.wave = d.wave ? { ...d.wave } : null;
    G.cam = { x: d.cam.x, y: d.cam.y, z: d.cam.z };
    _id = d.nextId || 1000;

    World.adopt(d.world);
    G.regrow = new Map(d.world.regrow);

    Buildings.byIdMap.clear();
    G.buildings = [];
    for (const bs of d.buildings) {
      const b = Buildings.create(bs.key, bs.x, bs.y, bs.built);
      b.hp = bs.hp; b.progress = bs.progress; b.growth = bs.growth; b.lit = !!bs.lit;
      b.fuel = bs.fuel || 0;
      b.drillType = bs.drillType || null; b.drillT = bs.drillT || 0;
      b.seamDepth = bs.seamDepth || 0; b.seamDay = bs.seamDay || 0;
      b.sap = bs.sap || 0; b.phase = bs.phase || null; b.decT = bs.decT || 0;
      b.demo = !!bs.demo;
      if (bs.clear && bs.clear.length) b.clearTiles = bs.clear.map(([x, y]) => ({ x, y }));
      if (!b.built) b.hp = b.maxHp * (0.1 + 0.9 * b.progress);
    }
    G.clearJobs = (d.clears || []).map(([x, y, w]) => ({ x, y, water: !!w }));

    G.villagers = d.villagers.map(vs => {
      const tr = TRAITS.find(t => t.key === vs.trait) || null;
      const v = {
        kind: 'v', id: NID(), name: vs.name, trait: tr,
        look: vs.look, job: vs.job === 'herbalist' ? 'medic' : vs.job,
        x: vs.x, y: vs.y, hp: vs.hp, maxHp: vs.maxHp || CONFIG.V.hp,
        hunger: vs.hunger, thirst: vs.thirst == null ? 30 : vs.thirst, schooled: !!vs.schooled, schooling: null,
        state: vs.state, path: null, pi: 0, anim: 0,
        tgt: null, tgtTile: null, workT: 0, workB: null,
        carry: { type: vs.carry ? vs.carry.type : null, amt: vs.carry ? vs.carry.amt : 0 },
        toolCond: vs.toolCond == null ? CONFIG.TOOL.cond : vs.toolCond, buzzed: !!vs.buzzed,
        atkCd: 0, fearT: 0, stuckT: 0, lastD: 1e9, aiT: Math.random() * .5,
        ate: false, starveWarned: false, parchWarned: false,
      };
      return v;
    });

    // re-link the wildcraft's people-links, which ride as array indexes
    G.villagers.forEach((v, ix) => {
      const pIx = d.villagers[ix] && d.villagers[ix].partnerIx;
      v.partner = (pIx != null && pIx >= 0 && G.villagers[pIx]) ? G.villagers[pIx].id : null;
      v.bondId = null; v.bondSc = 0;
    });
    G.banns = (d.banns || [])
      .map(([ai, bi]) => (G.villagers[ai] && G.villagers[bi]) ? { a: G.villagers[ai].id, b: G.villagers[bi].id } : null)
      .filter(Boolean);
    if (d.herd && d.herd.deer && d.herd.deer.length) {
      G.herd = {
        day: d.herd.day || G.day, hunt: !!d.herd.hunt, caught: d.herd.caught || 0,
        spawn: d.herd.spawn || { x: 3, y: 3 },
        drivers: [],
        deer: d.herd.deer.map(dd => ({ id: NID(), x: dd.x, y: dd.y, anim: dd.anim || 0, dang: dd.dang || 0 })),
      };
      G.herd.drivers = (d.herd.drivers || [])
        .map(ix => G.villagers[ix] ? G.villagers[ix].id : -1)
        .filter(id => id >= 0);
    }

    G.monsters = (d.monsters || []).map(ms => {
      const m = Entities.makeMonster(ms.type, ms.x, ms.y);
      m.hp = Math.min(m.maxHp, ms.hp);
      if (ms.burning) m.burning = 1.5;
      if (ms.type === 'lord') { G.boss = m; }
      return m;
    });
    UI.bossBar(G.boss);

    G.effects = []; G.floaters = [];
    G.sel = null; G.follow = null; G.speed = 1; G.paused = false;
    UI.refreshAll();
    UI.toast(`Day ${G.day} — the story continues.`, 'good');
    return true;

<script>
'use strict';
/* ============================================================
   Dawnhold — render.js
   Canvas renderer: camera, y-sorted world, water shimmer,
   fireflies, night lighting (dark overlay with light holes),
   effects, placement ghosts, minimap.
   ============================================================ */

const Render = {
  cv: null, ctx: null, lightCv: null, lctx: null,
  cw: 0, ch: 0, dpr: 1,
  fireflies: [], _mmT: 0, _t: 0,

  init() {
    this.cv = document.getElementById('game');
    this.ctx = this.cv.getContext('2d');
    this.lightCv = document.createElement('canvas');
    this.lctx = this.lightCv.getContext('2d');
    this.resize();
  },

  resize() {
    const vv = window.visualViewport;
    this.cw = Math.round(vv ? vv.width : window.innerWidth);
    this.ch = Math.round(vv ? vv.height : window.innerHeight);
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = Math.round(this.cw * this.dpr);
    this.cv.height = Math.round(this.ch * this.dpr);
    this.lightCv.width = this.cv.width;
    this.lightCv.height = this.cv.height;
    this.ctx.imageSmoothingEnabled = false;
  },

  worldToScreen(wx, wy) {
    return {
      x: (wx - G.cam.x) * G.cam.z + this.cw / 2,
      y: (wy - G.cam.y) * G.cam.z + this.ch / 2,
    };
  },
  screenToWorld(sx, sy) {
    return {
      x: (sx - this.cw / 2) / G.cam.z + G.cam.x,
      y: (sy - this.ch / 2) / G.cam.z + G.cam.y,
    };
  },

  clampCam() {
    const mw = World.W * CONFIG.TILE, mh = World.H * CONFIG.TILE;
    const vw = this.cw / G.cam.z / 2, vh = this.ch / G.cam.z / 2;
    G.cam.x = U.clamp(G.cam.x, Math.min(vw, mw / 2), Math.max(mw - vw, mw / 2));
    G.cam.y = U.clamp(G.cam.y, Math.min(vh, mh / 2), Math.max(mh - vh, mh / 2));
  },

  frame(dt) {
    this._t += dt;
    const ctx = this.ctx;
    // camera follow
    if (G.follow) { G.cam.x = U.lerp(G.cam.x, G.follow.x * 16, Math.min(1, dt * 5)); G.cam.y = U.lerp(G.cam.y, G.follow.y * 16, Math.min(1, dt * 5)); }
    this.clampCam();
    const shX = G.shake > 0 ? (Math.random() - .5) * G.shake : 0;
    const shY = G.shake > 0 ? (Math.random() - .5) * G.shake : 0;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.fillStyle = '#0c0e14';
    ctx.fillRect(0, 0, this.cw, this.ch);

    ctx.translate(this.cw / 2 + shX, this.ch / 2 + shY);
    ctx.scale(G.cam.z, G.cam.z);
    ctx.translate(-G.cam.x, -G.cam.y);

    // visible tile range
    const z = G.cam.z;
    const x0 = Math.max(0, ((G.cam.x - this.cw / 2 / z) / 16 | 0) - 1);
    const y0 = Math.max(0, ((G.cam.y - this.ch / 2 / z) / 16 | 0) - 1);
    const x1 = Math.min(World.W - 1, ((G.cam.x + this.cw / 2 / z) / 16 | 0) + 2);
    const y1 = Math.min(World.H - 1, ((G.cam.y + this.ch / 2 / z) / 16 | 0) + 3);

    ctx.drawImage(World.bakeCv, 0, 0);
    this.waterSparkle(x0, y0, x1, y1);

    // ---- gather y-sorted drawables ----
    const draws = [];
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const oi = World.idx(tx, ty);
        const o = World.obj[oi];
        if (!o || o === OBJ.FLOWER || o === OBJ.MUSH || o === OBJ.TGRASS) continue;
        let spr = null;
        const h = U.hash2(tx, ty);
        switch (o) {
          case OBJ.TREE: spr = Art.s['tree' + ((h * 2) | 0)]; break;
          case OBJ.PINE: spr = Art.s['pine' + ((h * 2) | 0)]; break;
          case OBJ.BIRCH: spr = Art.s['birch' + ((h * 2) | 0)]; break;
          case OBJ.DEADTREE: spr = Art.s.deadtree; break;
          case OBJ.BUSH: spr = World.amt[oi] > 0 ? Art.s.bushF : Art.s.bushE; break;
          case OBJ.HERB: spr = World.amt[oi] > 0 ? Art.s.herbF : Art.s.herbE; break;
          case OBJ.ROCK: spr = h < .22 ? Art.s.rockS : Art.s['rock' + ((h * 2) | 0)]; break;
          case OBJ.RUIN: spr = Art.s.ruin; break;
          case OBJ.CRYSTAL: spr = Art.s.crystal; break;
          case OBJ.STUMP: spr = Art.s.stump; break;
          case OBJ.SAPLING: spr = Art.s.sapling; break;
          case OBJ.GRAVE: spr = Art.s.grave; break;
          case OBJ.REED: spr = World.amt[oi] > 0 ? Art.s.reedF : Art.s.reedE; break;
        }
        if (spr) {
          const py = (ty + 1) * 16 - spr.height;
          draws.push({ y: ty * 16 + 16, fn: () => ctx.drawImage(spr, tx * 16, py) });
        }
      }
      // flat decor drawn directly (no y-sort needed)
      for (let tx = x0; tx <= x1; tx++) {
        const o = World.obj[World.idx(tx, ty)];
        if (o === OBJ.FLOWER || o === OBJ.MUSH || o === OBJ.TGRASS) {
          const spr = o === OBJ.MUSH ? Art.s.mush : o === OBJ.TGRASS ? Art.s['tgrass' + ((U.hash2(tx, ty) * 2) | 0)] : Art.s['flw' + ((U.hash2(tx, ty) * 2) | 0)];
          ctx.drawImage(spr, tx * 16, ty * 16);
        }
      }
    }

    // buildings
    for (const b of G.buildings) {
      if (b.x > x1 || b.y > y1 || b.x + b.w < x0 || b.y + b.h < y0) continue;
      draws.push({ y: (b.y + b.h) * 16, fn: () => this.drawBuilding(ctx, b) });
    }
    // villagers
    for (const v of G.villagers) {
      if (v.below) continue; // a miner in the Deep Seam is underground
      if (v.x * 16 < (x0 - 2) * 16 || v.x * 16 > (x1 + 2) * 16 || v.y * 16 < (y0 - 2) * 16 || v.y * 16 > (y1 + 2) * 16) continue;
      draws.push({ y: v.y * 16, fn: () => this.drawVillager(ctx, v) });
    }
    // monsters
    for (const m of G.monsters) {
      if (m.x * 16 < (x0 - 3) * 16 || m.x * 16 > (x1 + 3) * 16 || m.y * 16 < (y0 - 3) * 16 || m.y * 16 > (y1 + 3) * 16) continue;
      draws.push({ y: m.y * 16, fn: () => this.drawMonster(ctx, m) });
    }
    // the deer herd (the driven hunt)
    if (G.herd) {
      for (const d of G.herd.deer) {
        if (d.x * 16 < (x0 - 2) * 16 || d.x * 16 > (x1 + 2) * 16 || d.y * 16 < (y0 - 2) * 16 || d.y * 16 > (y1 + 2) * 16) continue;
        draws.push({ y: d.y * 16, fn: () => this.drawDeer(ctx, d) });
      }
    }

    draws.sort((a, b) => a.y - b.y);
    for (const d of draws) d.fn();

    this.drawClearMarks(ctx, x0, y0, x1, y1);
    this.drawWildsMarks(ctx, x0, y0, x1, y1);
    this.drawEffects(ctx);
    this.drawGhost(ctx, x0, y0, x1, y1);

    // ---- screen-space passes ----
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.lighting(shX, shY);
    this.drawFloaters(shX, shY);
  },

  waterSparkle(x0, y0, x1, y1) {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(200,230,255,.5)';
    const tf = (this._t * 1.5) | 0;
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const i = World.idx(tx, ty);
        if (World.t[i] !== T.WATER) continue;
        const h = U.hash2(tx + tf, ty);
        if (h < .16) {
          const px = tx * 16 + ((U.hash2(tx, ty + tf) * 13) | 0) + 1;
          const py = ty * 16 + ((h * 60) | 0) % 15;
          ctx.fillRect(px, py, 2, 1);
        }
      }
    }
  },

  drawBuilding(ctx, b) {
    const px = b.x * 16, py = (b.y + b.h) * 16; // anchor bottom of footprint
    let spr;
    const animF = ((this._t * 5) | 0) % 2;
    if (b.key === 'farm' || b.key === 'farm2') {
      const st = b.growth >= 1 ? 3 : b.growth > .55 ? 2 : b.growth > .18 ? 1 : 0;
      spr = Art.s[(b.key === 'farm2' ? 'farm2_' : 'farm') + st];
    } else if (b.key === 'torch') spr = Art.s['torch' + animF];
    else if (b.key === 'lair') spr = Art.s['lair' + animF];
    else if (b.key === 'windmill') spr = Art.s['windmill' + animF];
    else if (b.key === 'brazier') spr = Art.s[b.lit ? 'brazierOn' + animF : 'brazier'];
    else if (b.key === 'herbalistHut') spr = Art.s.herbalist;
    else spr = Art.s[b.key];

    if (!b.built) {
      // scaffold tiling + phantom building
      ctx.globalAlpha = 0.85;
      for (let dy = 0; dy < b.h; dy++)
        for (let dx = 0; dx < b.w; dx++) ctx.drawImage(Art.s.site, (b.x + dx) * 16, (b.y + dy) * 16);
      ctx.globalAlpha = 0.45;
      if (spr && spr.height > b.h * 16) ctx.drawImage(spr, px, py - spr.height);
      else if (spr) ctx.drawImage(spr, px, py - b.h * 16);
      ctx.globalAlpha = 1;
      // progress bar
      const bw = b.w * 16 - 4;
      ctx.fillStyle = '#0d0f15';
      ctx.fillRect(px + 2, py - b.h * 16 - 4, bw, 3);
      ctx.fillStyle = '#6fb3e0';
      ctx.fillRect(px + 2, py - b.h * 16 - 4, bw * b.progress, 3);
      return;
    }
    if (b.demo) {
      // being torn down — faded building with a red de-progress bar
      if (spr) {
        const hgt = spr.height > b.h * 16 ? spr.height : b.h * 16;
        ctx.globalAlpha = 0.55;
        ctx.drawImage(spr, px, py - hgt);
        ctx.globalAlpha = 1;
      }
      const bw = b.w * 16 - 4;
      ctx.fillStyle = '#0d0f15';
      ctx.fillRect(px + 2, py - b.h * 16 - 4, bw, 3);
      ctx.fillStyle = '#e05555';
      ctx.fillRect(px + 2, py - b.h * 16 - 4, bw * b.progress, 3);
      return;
    }
    if (spr) {
      const hgt = spr.height > b.h * 16 ? spr.height : b.h * 16;
      ctx.drawImage(spr, px, py - hgt);
    }
    if (b.key === 'beacon' && b.lit) {
      const f = Art.s['beaconF' + (((this._t * 5) | 0) % 2)];
      if (f) ctx.drawImage(f, px, py - 72);
    }
    // damage cracks/health bar
    if (b.hp < b.maxHp - 1) {
      const ratio = U.clamp(b.hp / b.maxHp, 0, 1);
      const bw = b.w * 16 - 4;
      ctx.fillStyle = 'rgba(13,15,21,.8)';
      ctx.fillRect(px + 2, py - b.h * 16 - 3, bw, 2.5);
      ctx.fillStyle = ratio > .5 ? '#7dc95e' : ratio > .25 ? '#e8a94b' : '#e05555';
      ctx.fillRect(px + 2, py - b.h * 16 - 3, bw * ratio, 2.5);
    }
  },

  drawVillager(ctx, v) {
    const px = v.x * 16 - 8, py = v.y * 16 - 14;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath();
    ctx.ellipse(v.x * 16, v.y * 16 + 1, 5, 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    const frame = v.path && v.pi < v.path.length ? 1 + ((v.anim | 0) % 2) : 0;
    const spr = Art.villager(v.look, frame);
    ctx.drawImage(spr, px | 0, py | 0);
    // carry icon
    if (v.carry.amt > 0) {
      const ic = v.carry.type === 'wood' ? Art.s.carryWood : v.carry.type === 'stone' ? Art.s.carryStone : v.carry.type === 'herbs' ? Art.s.carryHerb : Art.s.carryFood;
      ctx.drawImage(ic, (v.x * 16 - 3) | 0, (v.y * 16 - 24) | 0);
    }
    // hp
    if (v.hp < v.maxHp - 1) {
      const ratio = U.clamp(v.hp / v.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(13,15,21,.8)';
      ctx.fillRect(px + 2, py - 4, 12, 2);
      ctx.fillStyle = ratio > .4 ? '#7dc95e' : '#e05555';
      ctx.fillRect(px + 2, py - 4, 12 * ratio, 2);
    }
    // hunger pip
    if (v.hunger > 85) {
      ctx.fillStyle = '#e8a94b';
      ctx.fillRect(px + 7, py - 8, 2, 3);
    }
    if (G.sel && G.sel.kind === 'v' && G.sel.ref === v) {
      ctx.strokeStyle = '#ffe9a0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(v.x * 16, v.y * 16, 9, 0, Math.PI * 2);
      ctx.stroke();
    }
  },

  drawMonster(ctx, m) {
    const big = m.type === 'lord' || m.type === 'colossus';
    const spr = Art.monster(m.type, ((m.anim | 0) % 2));
    if (!spr) return;
    const bob = (m.type === 'shade' || m.type === 'lord' || m.type === 'wraith') ? Math.sin(this._t * 3 + m.id) * (m.type === 'wraith' ? 2.4 : 1.6) : 0;
    const px = m.x * 16 - spr.width / 2, py = m.y * 16 - spr.height + 2 + bob;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath();
    ctx.ellipse(m.x * 16, m.y * 16 + 1, big ? 9 : 5, big ? 4 : 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    if (m.type === 'wraith') ctx.globalAlpha = 0.8;
    ctx.drawImage(spr, px | 0, py | 0);
    ctx.globalAlpha = 1;
    if (m.frozenT > 0) {
      ctx.globalAlpha = .45;
      ctx.fillStyle = '#9ad4f0';
      ctx.fillRect(px | 0, py | 0, spr.width, spr.height);
      ctx.globalAlpha = 1;
    }
    if (m.flash > 0) {
      m.flash -= 0.016;
      ctx.globalAlpha = Math.min(.7, m.flash * 6);
      ctx.fillStyle = '#fff';
      ctx.fillRect(px | 0, py | 0, spr.width, spr.height);
      ctx.globalAlpha = 1;
    }
    if (m.hp < m.maxHp && !big) {
      const ratio = U.clamp(m.hp / m.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(13,15,21,.8)';
      ctx.fillRect(px + 1, py - 3, spr.width - 2, 2);
      ctx.fillStyle = '#e05555';
      ctx.fillRect(px + 1, py - 3, (spr.width - 2) * ratio, 2);
    }
    if (G.sel && G.sel.kind === 'm' && G.sel.ref === m) {
      ctx.strokeStyle = '#ff8a8a';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(m.x * 16, m.y * 16, big ? 12 : 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  },

  drawEffects(ctx) {
    for (const e of G.effects) {
      const p = e.t / e.dur;
      switch (e.type) {
        case 'spark': {
          const spr = Art.s.spark;
          ctx.globalAlpha = 1 - p;
          ctx.drawImage(spr, (e.x * 16 - 2) | 0, (e.y * 16 - p * 8) | 0);
          ctx.globalAlpha = 1;
          break;
        }
        case 'flame': {
          const spr = Art.s['flame' + (((e.t * 10) | 0) % 3)];
          ctx.globalAlpha = 1 - p * .7;
          ctx.drawImage(spr, (e.x * 16 - 3) | 0, (e.y * 16 - 6 - p * 6) | 0);
          ctx.globalAlpha = 1;
          break;
        }
        case 'smoke': {
          const spr = Art.s.smoke;
          ctx.globalAlpha = (1 - p) * .6;
          for (let i = 0; i < 3; i++) ctx.drawImage(spr, (e.x * 16 - 12 + i * 10) | 0, (e.y * 16 - 10 - p * 14 + i * 3) | 0);
          ctx.globalAlpha = 1;
          break;
        }
        case 'arrow': {
          const ax = U.lerp(e.x, e.tx, p), ay = U.lerp(e.y, e.ty, p) - Math.sin(p * Math.PI) * .5;
          ctx.drawImage(Art.s.arrow, (ax * 16 - 4) | 0, (ay * 16) | 0);
          break;
        }
        case 'bone': {
          const ax = U.lerp(e.x, e.tx, p), ay = U.lerp(e.y, e.ty, p) - Math.sin(p * Math.PI) * .9;
          ctx.drawImage(Art.s.bone, (ax * 16 - 3) | 0, (ay * 16 - 1) | 0);
          break;
        }
        case 'ring': {
          ctx.strokeStyle = e.col || '#fff';
          ctx.lineWidth = 1.5;
          ctx.globalAlpha = 1 - p;
          ctx.beginPath();
          ctx.arc(e.x * 16, e.y * 16, (e.r ? e.r : 1) * 16 * (0.3 + p * 0.9), 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
          break;
        }
        case 'meteor': {
          if (p < .55) {
            const fall = p / .55;
            const mx = e.x, my = e.y - (1 - fall) * 14;
            ctx.drawImage(Art.s.meteor, (mx * 16 - 3) | 0, (my * 16 - 3) | 0);
            ctx.strokeStyle = 'rgba(255,150,40,.6)';
            ctx.beginPath(); ctx.moveTo(mx * 16, my * 16 - 20); ctx.lineTo(mx * 16, my * 16 - 4); ctx.stroke();
            // target marker
            ctx.strokeStyle = 'rgba(255,120,40,.5)';
            ctx.beginPath(); ctx.arc(e.x * 16, e.y * 16, (CONFIG.POWERS.meteor.r) * 16 * .9, 0, Math.PI * 2); ctx.stroke();
          }
          break;
        }
        case 'corpse': {
          ctx.globalAlpha = (1 - p) * .9;
          const spr = Art.villager(e.look, 0);
          ctx.save();
          ctx.translate(e.x * 16, e.y * 16);
          ctx.rotate(Math.PI / 2);
          ctx.drawImage(spr, -8, -8);
          ctx.restore();
          ctx.globalAlpha = 1;
          break;
        }
      }
    }
  },

  drawDeer(ctx, d) {
    const spr = Art.s['deer' + (((d.anim | 0) % 2))];
    if (!spr) return;
    const px = d.x * 16 - spr.width / 2, py = d.y * 16 - spr.height + 2;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath();
    ctx.ellipse(d.x * 16, d.y * 16 + 1, 5, 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.drawImage(spr, px | 0, py | 0);
    if (G.sel && G.sel.kind === 'd') {
      ctx.strokeStyle = '#ffe9a0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(d.x * 16, d.y * 16, 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  },

  // wildcraft ground marks: tend stakes, dig brackets, and the sigil chalk
  drawWildsMarks(ctx, x0, y0, x1, y1) {
    const pulse = 0.6 + Math.sin(this._t * 3) * 0.2;
    // Grovekeep: a tiny stake with stage dots by every ordered bush
    for (const [i, t] of G.tend) {
      const x = i % World.W, y = (i / World.W) | 0;
      if (x < x0 - 1 || x > x1 + 1 || y < y0 - 1 || y > y1 + 1) continue;
      if (World.obj[i] !== OBJ.BUSH) continue;
      ctx.fillStyle = `rgba(143,212,94,${t.stage >= 2 ? 0.95 : pulse})`;
      ctx.fillRect(x * 16 + 1, y * 16 + 12, 2, 4);
      ctx.fillStyle = t.stage >= 1 ? '#8fd45e' : 'rgba(232,228,216,.6)';
      ctx.fillRect(x * 16 + 1, y * 16 + 10, 2, 2);
      if (t.stage >= 2) { ctx.fillStyle = '#ffd94a'; ctx.fillRect(x * 16 + 1, y * 16 + 8, 2, 2); }
    }
    // the Spade: blue corner brackets on queued dig tiles
    for (const t of G.digJobs) {
      if (t.x < x0 - 1 || t.x > x1 + 1 || t.y < y0 - 1 || t.y > y1 + 1) continue;
      const px = t.x * 16, py = t.y * 16;
      ctx.strokeStyle = `rgba(133,183,222,${pulse + 0.2})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(px + 2, py + 6); ctx.lineTo(px + 2, py + 2); ctx.lineTo(px + 6, py + 2);
      ctx.moveTo(px + 10, py + 2); ctx.lineTo(px + 14, py + 2); ctx.lineTo(px + 14, py + 6);
      ctx.moveTo(px + 14, py + 10); ctx.lineTo(px + 14, py + 14); ctx.lineTo(px + 10, py + 14);
      ctx.moveTo(px + 6, py + 14); ctx.lineTo(px + 2, py + 14); ctx.lineTo(px + 2, py + 10);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    // sigil chalk: a dashed chalk square per tile, brighter once bloomed
    const chalk = (tiles, col, alpha, dashOff) => {
      ctx.strokeStyle = col;
      ctx.globalAlpha = alpha;
      ctx.setLineDash([3, 3]);
      ctx.lineDashOffset = dashOff;
      for (const t of tiles) {
        if (t.x < x0 - 1 || t.x > x1 + 1 || t.y < y0 - 1 || t.y > y1 + 1) continue;
        ctx.strokeRect(t.x * 16 + 1.5, t.y * 16 + 1.5, 13, 13);
      }
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    };
    for (const s of G.sigils) {
      const ward = s.kind === 'ward';
      const col = ward ? '#ffb057' : '#7de0d4';
      chalk(s.tiles, col, s.bloomed ? 0.95 : pulse * 0.7, ward ? 0 : 4);
      if (s.bloomed) {
        // a glow stone at the sigil's heart
        const c = s.tiles[(s.tiles.length / 2) | 0];
        ctx.fillStyle = ward ? 'rgba(255,176,87,.5)' : 'rgba(125,224,212,.5)';
        ctx.beginPath();
        ctx.arc((c.x + .5) * 16, (c.y + .5) * 16, 3 + Math.sin(this._t * 5) * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // the draft being drawn right now
    if (G.sigilDraft && G.sigilDraft.tiles.length) {
      chalk(G.sigilDraft.tiles, G.sigilDraft.kind === 'ward' ? '#e8e4d8' : '#cfeee8', 0.9, -(this._t * 6) % 6);
    }
  },

  drawGhost(ctx, x0, y0, x1, y1) {
    const mode = UI.mode;
    if (!mode || !UI.ghost) return;
    const gx = UI.ghost.x, gy = UI.ghost.y; // tile ints
    if (mode.type === 'build') {
      const def = BUILD[mode.key];
      if (!def) return;
      const chk = Buildings.canPlace(mode.key, gx, gy);
      const ok = chk.ok && Buildings.afford(mode.key);
      for (let dy = 0; dy < def.h; dy++)
        for (let dx = 0; dx < def.w; dx++) {
          ctx.fillStyle = ok ? 'rgba(120,220,110,.30)' : 'rgba(230,80,80,.30)';
          ctx.fillRect((gx + dx) * 16, (gy + dy) * 16, 16, 16);
          ctx.strokeStyle = ok ? 'rgba(150,255,140,.8)' : 'rgba(255,110,110,.8)';
          ctx.lineWidth = 1;
          ctx.strokeRect((gx + dx) * 16 + .5, (gy + dy) * 16 + .5, 15, 15);
        }
      if (ok && !def.terrain) {
        ctx.globalAlpha = .6;
        const GHOST_SPR = { farm: 'farm0', farm2: 'farm2_0', windmill: 'windmill0', torch: 'torch0', herbalistHut: 'herbalist', road: 'road0' };
        const spr = Art.s[GHOST_SPR[mode.key] || mode.key];
        if (spr) {
          const hgt = Math.max(spr.height, def.h * 16);
          ctx.drawImage(spr, gx * 16, (gy + def.h) * 16 - hgt);
        }
        ctx.globalAlpha = 1;
      }
    } else if (mode.type === 'power') {
      const p = POWERS[mode.key];
      if (p && p.target === 'area') {
        ctx.strokeStyle = 'rgba(220,160,255,.9)';
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        ctx.arc((gx + .5) * 16, (gy + .5) * 16, p.r * 16, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    } else if (mode.type === 'demolish') {
      ctx.strokeStyle = 'rgba(255,110,110,.9)';
      ctx.strokeRect(gx * 16 + .5, gy * 16 + .5, 15, 15);
    } else if (mode.type === 'clear') {
      ctx.strokeStyle = 'rgba(150,255,140,.9)';
      ctx.strokeRect(gx * 16 + .5, gy * 16 + .5, 15, 15);
    } else if (mode.type === 'dig') {
      // a tile about to become pond: blue wash + a shovel stroke
      const ok = !World.bldAt(gx, gy) && World.tileT(gx, gy) !== T.WATER;
      ctx.fillStyle = ok ? 'rgba(110,170,220,.30)' : 'rgba(230,80,80,.30)';
      ctx.fillRect(gx * 16, gy * 16, 16, 16);
      ctx.strokeStyle = ok ? 'rgba(160,210,250,.9)' : 'rgba(255,110,110,.9)';
      ctx.strokeRect(gx * 16 + .5, gy * 16 + .5, 15, 15);
    } else if (mode.type === 'plant') {
      // a sapling or cutting about to go into the ground
      const ok = Wilds.canPlantBush(gx, gy) && (mode.what === 'bush' ? G.cuttings >= 1 : !!Wilds.nursery() && (Wilds.nursery().sap || 0) >= 1);
      ctx.strokeStyle = ok ? 'rgba(150,255,140,.9)' : 'rgba(255,110,110,.9)';
      ctx.beginPath();
      ctx.arc(gx * 16 + 8, gy * 16 + 12, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = .6;
      const spr = mode.what === 'bush' ? Art.s.bushF : Art.s.sapling;
      if (spr) ctx.drawImage(spr, gx * 16, (gy + 1) * 16 - spr.height);
      ctx.globalAlpha = 1;
    } else if (mode.type === 'sigil') {
      // the tile the chalk is on right now
      ctx.strokeStyle = mode.kind === 'ward' ? 'rgba(255,176,87,.9)' : 'rgba(125,224,212,.9)';
      ctx.setLineDash([3, 3]);
      ctx.strokeRect(gx * 16 + 1.5, gy * 16 + 1.5, 13, 13);
      ctx.setLineDash([]);
    }
  },

  // amber X over tiles queued for clearing
  drawClearMarks(ctx, x0, y0, x1, y1) {
    if (!G.clearJobs || !G.clearJobs.length) return;
    ctx.lineWidth = 2;
    for (const t of G.clearJobs) {
      if (t.x < x0 - 1 || t.x > x1 + 1 || t.y < y0 - 1 || t.y > y1 + 1) continue;
      const px = t.x * 16, py = t.y * 16;
      ctx.strokeStyle = t.water ? 'rgba(133,183,222,.95)' : 'rgba(255,196,107,.95)';
      ctx.beginPath();
      ctx.moveTo(px + 4, py + 4); ctx.lineTo(px + 12, py + 12);
      ctx.moveTo(px + 12, py + 4); ctx.lineTo(px + 4, py + 12);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
  },

  lighting(shX, shY) {
    const ctx = this.ctx;
    const dark = darknessLevel();
    const warm = (G.phase === 'dusk' ? G.time / CONFIG.TRANS : G.phase === 'dawn' ? 1 - G.time / CONFIG.TRANS : 0);

    if (dark > 0.02) {
      const lc = this.lightCv, lx = this.lctx;
      lx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      lx.globalCompositeOperation = 'source-over';
      lx.clearRect(0, 0, this.cw, this.ch);
      lx.fillStyle = `rgba(8,10,32,${dark})`;
      lx.fillRect(0, 0, this.cw, this.ch);
      lx.globalCompositeOperation = 'destination-out';

      const hole = (wx, wy, r, a) => { // wx, wy in tile units
        const s = this.worldToScreen(wx * 16, wy * 16);
        const rr = r * 16 * G.cam.z;
        if (s.x < -rr || s.y < -rr || s.x > this.cw + rr || s.y > this.ch + rr) return;
        const g = lx.createRadialGradient(s.x, s.y, rr * 0.15, s.x, s.y, rr);
        g.addColorStop(0, `rgba(0,0,0,${a})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        lx.fillStyle = g;
        lx.beginPath(); lx.arc(s.x, s.y, rr, 0, Math.PI * 2); lx.fill();
      };
      // building lights
      const oilDry = G.res.oil <= 0; // dry torches gutter to half-light
      for (const b of G.buildings) {
        if (!b.built) continue;
        let r = b.def.light;
        if (b.key === 'brazier') r = b.lit ? CONFIG.BRAZIER.light + Math.sin(this._t * 6 + b.id) * 0.2 : 0;
        if (!r) continue;
        if (b.key === 'torch') r = (oilDry ? 1.7 : 3.4) + Math.sin(this._t * 7 + b.id) * (oilDry ? .04 : .12);
        hole(b.x + b.w / 2, b.y + b.h / 2 - (b.def.tall || 0) / 32, r, 0.92);
      }
      if (G.beaconLit) {
        const b = G.buildings.find(bb => bb.key === 'beacon' && bb.built);
        if (b) hole(b.x + 1.5, b.y + .8, 15 + Math.sin(this._t * 3) * .8, 0.98);
      }
      // burning monsters glow faintly
      for (const m of G.monsters) if (m.burning > 0) hole(m.x, m.y, 1.2, 0.5);
      for (const e of G.effects) if (e.type === 'flame') hole(e.x, e.y, 1.6, 0.6);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(lc, 0, 0);
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

      // warm additive glow on top of the carved light holes — torches
      // breathe (radius wobble) so the night never sits still
      ctx.globalCompositeOperation = 'lighter';
      const warmGlow = (wx, wy, r) => {
        const s = this.worldToScreen(wx * 16, wy * 16);
        const rr = r * 16 * G.cam.z;
        if (s.x < -rr || s.y < -rr || s.x > this.cw + rr || s.y > this.ch + rr) return;
        const g = ctx.createRadialGradient(s.x, s.y, rr * 0.1, s.x, s.y, rr);
        g.addColorStop(0, 'rgba(255,180,80,0.13)');
        g.addColorStop(1, 'rgba(255,150,60,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, rr, 0, Math.PI * 2); ctx.fill();
      };
      for (const b of G.buildings) {
        if (!b.built) continue;
        const isBrz = b.key === 'brazier' && b.lit;
        if (!b.def.light && !isBrz) continue;
        const dim = b.key === 'torch' && oilDry;
        const wob = (b.key === 'torch' || isBrz) ? 1 + Math.sin(this._t * 9 + b.id * 1.7) * 0.09 : 1;
        warmGlow(b.x + b.w / 2, b.y + b.h / 2 - (b.def.tall || 0) / 32, (isBrz ? 3.4 : b.key === 'torch' ? (dim ? 1.0 : 2.2) : b.def.light * 0.8) * wob);
      }
      if (G.beaconLit) {
        const b = G.buildings.find(bb => bb.key === 'beacon' && bb.built);
        if (b) warmGlow(b.x + 1.5, b.y + 0.8, 11 + Math.sin(this._t * 5) * 0.7);
      }
      ctx.globalCompositeOperation = 'source-over';
      this.firefliesDraw();
    }
    if (dark > 0.02 && G.bloodMoon) {
      ctx.fillStyle = `rgba(160,30,40,${0.16 * dark})`;
      ctx.fillRect(0, 0, this.cw, this.ch);
    }
    // time-of-day grade: dusk bleeds orange into violet as the dark rises;
    // dawn washes gold instead
    if (warm > 0.02) {
      if (G.phase === 'dusk') {
        ctx.fillStyle = `rgba(255,140,50,${warm * 0.13})`;
        ctx.fillRect(0, 0, this.cw, this.ch);
        ctx.fillStyle = `rgba(120,60,160,${warm * 0.12 * dark})`;
        ctx.fillRect(0, 0, this.cw, this.ch);
      } else {
        ctx.fillStyle = `rgba(255,196,90,${warm * 0.12})`;
        ctx.fillRect(0, 0, this.cw, this.ch);
      }
    }
  },

  firefliesDraw() {
    const ctx = this.ctx;
    const want = G.settings.fx ? 16 : 6;
    while (this.fireflies.length < want) {
      this.fireflies.push({
        x: Math.random() * World.W, y: Math.random() * World.H,
        vx: 0, vy: 0, ph: Math.random() * 6,
      });
    }
    while (this.fireflies.length > want) this.fireflies.pop();
    for (const f of this.fireflies) {
      f.ph += 0.03;
      f.vx += (Math.random() - .5) * .02; f.vy += (Math.random() - .5) * .02;
      f.vx = U.clamp(f.vx, -.06, .06); f.vy = U.clamp(f.vy, -.06, .06);
      f.x += f.vx; f.y += f.vy;
      if (f.x < 2 || f.x > World.W - 2) f.vx *= -1;
      if (f.y < 2 || f.y > World.H - 2) f.vy *= -1;
      const a = 0.35 + Math.sin(f.ph) * 0.3;
      if (a <= 0.05) continue;
      const s = this.worldToScreen(f.x * 16, f.y * 16);
      ctx.fillStyle = `rgba(220,255,140,${a})`;
      ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
      ctx.fillStyle = `rgba(200,240,120,${a * 0.35})`;
      ctx.fillRect(s.x - 2.5, s.y - 2.5, 5, 5);
    }
  },

  drawFloaters(shX, shY) {
    const ctx = this.ctx;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    for (const f of G.floaters) {
      const s = this.worldToScreen(f.x * 16, f.y * 16);
      const rise = f.t * 18;
      ctx.globalAlpha = U.clamp(1.4 - f.t, 0, 1);
      ctx.fillStyle = '#000';
      ctx.fillText(f.text, s.x + 1, s.y - rise + 1);
      ctx.fillStyle = f.col;
      ctx.fillText(f.text, s.x, s.y - rise);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'left';
  },

  /* -------- minimap -------- */
  minimap(dt) {
    this._mmT -= dt;
    if (this._mmT > 0) return;
    this._mmT = 0.3;
    const cv = document.getElementById('minimap');
    if (!cv) return;
    const x = cv.getContext('2d');
    const W = World.W, H = World.H;
    const img = x.createImageData(W, H);
    const d = img.data;
    const MM = Art.MM;
    const col = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
    const cGrass = col(MM.grass), cWater = col(MM.water), cTree = col(MM.tree), cRoad = col(MM.road), cRock = col(MM.rock), cDirt = col(MM.dirt), cSand = col(MM.sand);
    for (let i = 0; i < W * H; i++) {
      let c = cGrass;
      const t = World.t[i], o = World.obj[i];
      if (t === T.WATER) c = cWater;
      else if (t === T.ROAD) c = cRoad;
      else if (t === T.SAND) c = cSand;
      else if (t === T.DIRT) c = cDirt;
      else if (o === OBJ.TREE || o === OBJ.PINE || o === OBJ.BIRCH || o === OBJ.SAPLING) c = cTree;
      else if (o === OBJ.ROCK || o === OBJ.RUIN) c = cRock;
      else if (o === OBJ.CRYSTAL) c = [140, 92, 208];
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    // buildings (lairs glow purple)
    for (const b of G.buildings) {
      const cc = b.key === 'lair' ? [180, 110, 240] : col(MM.bld);
      for (let dy = 0; dy < b.h; dy++) for (let dx = 0; dx < b.w; dx++) {
        const i = (b.y + dy) * W + (b.x + dx);
        if (i >= 0 && i < W * H) { d[i * 4] = cc[0]; d[i * 4 + 1] = cc[1]; d[i * 4 + 2] = cc[2]; }
      }
    }
    x.putImageData(img, 0, 0);
    // lairs get a hot-pink 3px cross so they never blend into crystal purple
    x.fillStyle = '#ff6ae0';
    for (const b of G.buildings) {
      if (b.key !== 'lair') continue;
      x.fillRect(b.x - 1, b.y, 3, 1);
      x.fillRect(b.x, b.y - 1, 1, 3);
    }
    // entities as dots (crisper on top)
    x.fillStyle = '#fff';
    for (const v of G.villagers) x.fillRect(v.x | 0, v.y | 0, 1, 1);
    x.fillStyle = '#ff6060';
    for (const m of G.monsters) x.fillRect((m.x | 0) - (m.type === 'lord' ? 1 : 0), (m.y | 0) - (m.type === 'lord' ? 1 : 0), m.type === 'lord' ? 3 : 1, m.type === 'lord' ? 3 : 1);
    // viewport rect
    const z = G.cam.z;
    const vw = this.cw / z / 16, vh = this.ch / z / 16;
    x.strokeStyle = 'rgba(255,255,255,.7)';
    x.lineWidth = 1;
    x.strokeRect(G.cam.x / 16 - vw / 2, G.cam.y / 16 - vh / 2, vw, vh);
  },
};

    { text: 'The night is theirs — until it isn\u2019t.<br><b>Powers</b> burn Essence: <b>Smite</b> erases shades. The horde crawls from the <b>Dark Monoliths</b> — the purple dots on your map. Essence flows back from every kill.', done: () => !isNightLike() && G.day > 1 },

  /* ================= init ================= */
  init() {
