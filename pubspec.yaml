name: all_in_one
description: "A fast cross-platform hub for a growing collection of focused apps."
publish_to: 'none'

version: 0.2.7+10

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  file_picker: ^3.0.4
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/audio/nature/
    - assets/audio/focus/

flutter_launcher_icons:
  image_path: assets/branding/one_hub_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
    image_path: assets/branding/one_hub_icon.png
